name: Android Prototype
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Rogue host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev zlib1g-dev
      - name: Probe Rogue Core on Android ARM64
        run: |
          set -o pipefail
          chmod +x scripts/fetch_rogue_core.sh scripts/android_core_probe.sh
          scripts/android_core_probe.sh 2>&1 | tee core-probe.log
      - name: Upload core probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogue-core-arm64-probe
          path: |
            core-probe.log
            build/core-probe/unresolved-stage1.txt
            build/core-probe/critical-stage2.txt
            build/core-probe/hub_script_pointer_manifest.txt
            build/core-probe/unresolved-providers.txt
            build/core-probe/provider-summary.txt
          if-no-files-found: warn
      - name: Build ARM64 debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and native runtime
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q "lib/arm64-v8a/librogue25d.so" /tmp/apk-files.txt
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rogue-android-2.5d-prototype
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
